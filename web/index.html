<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <!-- Inter/Newsreader come from Google Fonts. display=optional: if the
         files aren't ready in ~100ms, keep the fallback for this page load
         instead of swapping mid-paint (the "wrong font for a frame" flash
         that display=swap causes). Cached visits still get the real faces.
         preconnect starts DNS/TLS before the stylesheet request. Don't
         @import these from index.css — that delays the font fetch until
         after CSS parse. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=optional"
      rel="stylesheet"
    />
    <title>Corella</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
