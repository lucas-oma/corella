[project]
name = "corella-server"
version = "0.1.0"
description = "Self-hosted voice-meeting assistant server"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "email-validator==2.2.0",
    "pydantic-settings==2.7.0",
    "sqlalchemy==2.0.36",
    # SQLAlchemy's asyncio support needs this at runtime — it was only ever
    # present in the real Docker image transitively (pulled in incidentally
    # by some other package's own dependency graph), never declared here.
    # A latent fragility, found by actually running a fresh `pip install`
    # against this file rather than the long-lived Docker image/venv that
    # happened to already have it. Declaring it explicitly, as SQLAlchemy's
    # own docs recommend for asyncio use.
    "greenlet==3.5.5",
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "psycopg[binary]==3.2.3",
    "python-jose[cryptography]==3.3.0",
    "cryptography==44.0.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",  # passlib 1.7.4 doesn't support bcrypt's 4.1+ API changes
    "python-multipart==0.0.19",
    "celery==5.4.0",
    "redis==5.2.1",
    "qdrant-client==1.12.1",
    "httpx==0.28.1",
    # Live recording (app/ws/live_session.py): faster-whisper depends only on
    # CTranslate2/onnxruntime, not torch, so — unlike pyannote.audio/
    # sentence-transformers below — it's light enough to run in the api
    # process itself rather than needing a worker/Celery round-trip.
    "faster-whisper==1.1.0",
    "requests==2.32.3",  # faster-whisper's own model-download path needs it directly
    "webrtcvad==2.0.10",
    # A range, not an exact pin: mixing.py's numpy usage (zeros/frombuffer/
    # astype/clip/tobytes) is trivial and version-agnostic, and an exact pin
    # here was needlessly fighting the worker extras' own numpy constraints
    # (onnxruntime, ctranslate2, qdrant-client, matplotlib all want a say)
    # during dependency resolution — let pip actually solve the whole graph.
    "numpy>=1.26,<3",
    # Live copilot (app/services/llm/, app/services/copilot/): official SDK
    # for Anthropic per house convention; openai/gemini/ollama are hand-rolled
    # httpx clients against their stable REST shapes (see app/services/llm/).
    "anthropic==1.3.0",
    # Query embeddings for KB retrieval — fastembed is ONNX-based (no torch),
    # verified to produce numerically-identical vectors (cosine sim 1.000000)
    # to the worker's sentence-transformers path for the same model, so the
    # api process can embed retrieval queries in-process.
    "fastembed==0.8.0",
    # Deepgram live streaming (app/services/asr/deepgram_stream.py): was only
    # ever present transitively via uvicorn[standard], same latent-dependency
    # class as greenlet above — now genuinely imported and used directly, so
    # it needs to be declared here too.
    "websockets==17.1",
]

[project.optional-dependencies]
worker = [
    # 3.3.2 is broken as installed: it declares torchaudio>=2.2.0 with no
    # upper bound, pip resolves the latest torch (2.14.0) but torchaudio's
    # release cadence lags behind, landing on torchaudio 2.11.0 — which
    # already dropped the top-level `torchaudio.AudioMetaData` attribute
    # 3.3.2's own io.py references, so the import itself fails. 4.x is the
    # pyannote maintainers' own fix: it drops the torchaudio audio-IO
    # backend entirely in favor of torchcodec/ffmpeg. Verified empirically
    # against this project's actual diarize() usage before pinning.
    "pyannote.audio==4.0.7",
    "torchcodec",
    "sentence-transformers==3.3.1",
    "pypdf==5.1.0",
]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "ruff==0.8.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Deliberately NOT pinning asyncio_default_fixture_loop_scope to "session":
# tests/conftest.py's fixtures each build a fresh, NullPool, disposed-per-
# test engine specifically so every fixture and the test body share one
# ordinary function-scoped loop — pytest-asyncio's plain default. A
# session-scoped loop was tried first and made things worse (fixtures and
# the test body then landing on genuinely different loops), see
# conftest.py's module docstring for the full story.

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
# Calibrated against this codebase as it actually stands (not a default
# "everything on" list) — see the note in CONTRIBUTING.md: the explicit
# goal is a CI check that starts green and stays fast to satisfy, not one
# that immediately buries every future PR under a wall of pre-existing
# violations from code this ruleset was never run against before. E501
# (line-too-long) is dropped in favor of the line-length above already
# being generous; everything selected here passed cleanly against the
# real codebase before this was wired into CI.
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's own dependency-injection idiom (`db: AsyncSession =
# Depends(get_db)`) is a function call in a default argument by design —
# B008 flags every single one of them (76 hits across this codebase) as
# if it were the real bug that rule exists to catch elsewhere. This is
# ruff's own documented fix for FastAPI specifically, not a loophole.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header", "fastapi.Body"]
