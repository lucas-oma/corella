name: PR checks

# Required checks (see CONTRIBUTING.md for the branching model): main is
# the integration branch, release is the stable-cut branch — anything
# landing on either should meet the same bar. Enabling these as "required
# status checks" in GitHub's branch protection settings is a repo-admin
# action taken separately in the GitHub UI, not something this file does
# on its own.
on:
  pull_request:
    branches: [main, release]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: server
        run: pip install -e ".[dev]"
      - run: ruff check server/app server/tests

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: corella
          POSTGRES_DB: corella_test
          # No password at all, rather than a throwaway one — this
          # container only ever exists for this one job's lifetime, with
          # no exposure beyond localhost inside the runner, so there's
          # nothing a password would actually protect here. Also sidesteps
          # secret-scanner false positives on a `user:password@host`
          # connection string (GitGuardian flagged the previous version).
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U corella"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://corella@localhost:5432/corella_test
      # Per-run, non-word-shaped value rather than a fixed string — same
      # false-positive avoidance as POSTGRES_HOST_AUTH_METHOD above, and
      # this container never outlives the job anyway.
      JWT_SECRET: ci-run-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: server
        run: pip install -e ".[dev]"
      - working-directory: server
        run: pytest -v

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run build
